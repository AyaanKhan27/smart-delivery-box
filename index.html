<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Delivery Box — MQTT Diagnostic V5</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#f5f5f5;color:#111}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
h1{font-size:22px;margin-top:0}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.row:last-child{border-bottom:0}
.status{font-weight:700}
.pass{color:#16833b}.fail{color:#c62828}.wait{color:#b26a00}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:white;font-size:16px}
small{color:#666;line-height:1.5}
#log{font-family:monospace;font-size:12px;white-space:pre-wrap;background:#111;color:#eee;padding:14px;border-radius:10px;min-height:100px}
</style>
</head>
<body>
<div class="card">
<h1>Smart Delivery Box — Connection Diagnostic V5</h1>
<small>This page does not change your ESP32 or circuit. It only tests the browser connection.</small>
</div>

<div class="card">
<div class="row"><span>1. Internet</span><span id="internet" class="status wait">TESTING...</span></div>
<div class="row"><span>2. Secure WebSocket</span><span id="ws" class="status wait">TESTING...</span></div>
<div class="row"><span>3. MQTT WebSocket</span><span id="mqtt" class="status wait">TESTING...</span></div>
<div class="row"><span>4. Broker response</span><span id="broker" class="status wait">WAITING...</span></div>
</div>

<div class="card">
<button onclick="runTests()">Run Diagnostic Again</button>
</div>

<div class="card">
<strong>Technical log</strong>
<div id="log"></div>
</div>

<script src="https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js"></script>
<script>
const el=id=>document.getElementById(id);
const logEl=el('log');
function log(s){logEl.textContent += new Date().toLocaleTimeString()+"  "+s+"\\n";}

function setStatus(id,text,cls){
  const e=el(id); e.textContent=text; e.className="status "+cls;
}

async function internetTest(){
  try{
    await fetch("https://www.google.com/generate_204",{mode:"no-cors",cache:"no-store"});
    setStatus("internet","PASS","pass"); log("Internet request completed.");
    return true;
  }catch(e){
    setStatus("internet","FAIL","fail"); log("Internet FAIL: "+e.message);
    return false;
  }
}

function websocketTest(){
 return new Promise(resolve=>{
   let done=false;
   const finish=(ok,msg)=>{
     if(done)return; done=true;
     try{ws.close()}catch(_){}
     setStatus("ws",ok?"PASS":"FAIL",ok?"pass":"fail");
     log("WebSocket "+(ok?"PASS: ":"FAIL: ")+msg);
     resolve(ok);
   };
   const ws=new WebSocket("wss://echo.websocket.events/");
   const timer=setTimeout(()=>finish(false,"connection timeout"),8000);
   ws.onopen=()=>{clearTimeout(timer); try{ws.send("SDB-V5-TEST")}catch(_){} finish(true,"connection opened");};
   ws.onerror=()=>{clearTimeout(timer); finish(false,"browser reported WebSocket error");};
   ws.onclose=()=>{if(!done){clearTimeout(timer);finish(false,"closed before opening");}};
 });
}

function mqttTest(){
 return new Promise(resolve=>{
   setStatus("mqtt","TESTING...","wait");
   setStatus("broker","WAITING...","wait");
   log("Connecting to mqtt.eclipseprojects.io:443 over WSS...");
   let settled=false;
   const finish=(ok,msg)=>{
     if(settled)return; settled=true;
     setStatus("mqtt",ok?"PASS":"FAIL",ok?"pass":"fail");
     setStatus("broker",ok?"REACHED":"NOT REACHED",ok?"pass":"fail");
     log("MQTT "+(ok?"PASS: ":"FAIL: ")+msg);
     try{client.end(true)}catch(_){}
     resolve(ok);
   };
   const client=mqtt.connect("wss://mqtt.eclipseprojects.io:443/mqtt",{
     clientId:"sdb-v5-"+Math.random().toString(16).slice(2),
     clean:true,connectTimeout:8000,reconnectPeriod:0,
     keepalive:20
   });
   const timer=setTimeout(()=>finish(false,"MQTT connection timeout"),10000);
   client.on("connect",()=>{clearTimeout(timer);finish(true,"MQTT connection established");});
   client.on("error",err=>{clearTimeout(timer);finish(false,(err&&err.message)||"MQTT error");});
   client.on("close",()=>{if(!settled){clearTimeout(timer);finish(false,"MQTT socket closed before connect");}});
 });
}

async function runTests(){
 logEl.textContent="";
 setStatus("internet","TESTING...","wait");
 setStatus("ws","TESTING...","wait");
 setStatus("mqtt","WAITING...","wait");
 setStatus("broker","WAITING...","wait");
 await internetTest();
 await websocketTest();
 await mqttTest();
 log("Diagnostic complete.");
}
runTests();
</script>
</body>
</html>
